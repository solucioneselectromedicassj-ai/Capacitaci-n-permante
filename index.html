<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#263248;--bd:#334155;--bds:#475569;

--warn:#f59e0b;--warn-bg:#451a03;--warn-bd:#92400e;
--err:#ef4444;--err-bg:#450a0a;--err-bd:#991b1b;
--p:#3b82f6;--tx:#f1f5f9;--mu:#94a3b8;--acc:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh}
.w{max-width:500px;margin:0 auto;padding:16px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bds);
background:var(--card2);color:var(--tx);font-size:14px;margin-bottom:4px;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p)}
.btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;
font-weight:500;cursor:pointer;margin-bottom:8px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-g{background:transparent;border:.5px solid var(--bds);color:var(--mu);font-size:12px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;margin-bottom:12px;padding:0}
.prog{background:var(--bd);border-radius:3px;height:4px}
.pf{height:4px;border-radius:3px;transition:width .3s}
.srow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sn{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;margin-top:1px}
.st{font-size:14px;line-height:1.55}
.sd{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.tip{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.tw{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.ts{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.td{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.chk{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;
margin-bottom:8px;cursor:pointer;border:.5px solid var(--bd);transition:all .15s}
.chk.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt{background:var(--card2);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;
margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;transition:all .2s}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.ol{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid currentColor;
display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.eqli{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;
margin-bottom:8px;background:var(--card);border:.5px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;margin-top:4px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
border-radius:8px;background:var(--card2);border:.5px solid var(--bd);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;
gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;
cursor:pointer;margin-top:4px;margin-bottom:8px}
.user-row{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:.5px solid var(--bd);background:var(--card2)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

async function syncBackend(svcId,eqId,p){
 if(!BACKEND_URL||!S.user)return;
 const con=eqContent(svcId,eqId);
 const eq=SVCS.find(s=>s.id===svcId)?.eq.find(e=>e.id===eqId);
 const svc=SVCS.find(s=>s.id===svcId);
 try{
  await fetch(BACKEND_URL,{
   method:'POST',mode:'no-cors',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    name:S.user.name,role:S.user.role,dept:S.user.dept,
    service:svc?.name,equipment:eq?.name,
    mods:p.mods.length,totalMods:con?.mods.length||0,
    done:p.done||false,score:p.score||0,totalQuiz:con?.quiz.length||10,
    passed:p.done&&p.score>=PASS,date:p.date||'-',
   })
  });
 }catch(e){}
}

async function fetchBackend(){
 if(!BACKEND_URL)return null;
 try{
  const r=await fetch(BACKEND_URL+'?nocache='+Date.now());
  const d=await r.json();
  return d.users||[];
 }catch(e){return null;}
}

function pk(s,e){return`${s||S.svcId}/${e||S.eqId}`;}

function rSlide(mod,slide,mi,si){
 const col=slide.color||mod.color||'#3b82f6';
 const hdr=`<h3 style="font-size:17px;font-weight:500;margin-bottom:${slide.sub?'3px':'10px'}">${slide.title}</h3>${slide.sub?`<p class="muted" style="margin-bottom:10px">${slide.sub}</p>`:''}`;
 if(slide.type==='device'){
  const zo=S.zone?SE3_ZONES.find(z=>z.id===S.zone):null;
  return hdr+`<div style="padding:8px;background:var(--card2);border-radius:8px;margin-bottom:10px">${se3SVG()}</div>
  ${zo?`<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid ${zo.col}"><p style="font-weight:500;color:${zo.col};margin-bottom:6px">${zo.label}</p><p class="muted" style="line-height:1.65">${zo.desc}</p></div>`:`<p class="muted" style="text-align:center;padding:8px">👆 Tocá cualquier zona del equipo</p>`}`;
 }
 if(slide.type==='device_dfm'){
  const zo=S.zone?DFM100_ZONES.find(z=>z.id===S.zone):null;
  return hdr+`<div style="padding:8px;background:var(--card2);border-radius:8px;margin-bottom:10px">${dfm100SVG()}</div>
  ${zo?`<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid ${zo.col}"><p style="font-weight:500;color:${zo.col};margin-bottom:6px">${zo.label}</p><p class="muted" style="line-height:1.65;white-space:pre-line">${zo.desc}</p></div>`:`<p class="muted" style="text-align:center;padding:8px">👆 Tocá cualquier zona del equipo</p>`}`;
 }
 if(slide.type==='keys'){
  const k=S.ak;
  return hdr+`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${SE3_KEYS.map((ky,i)=>`<button onclick="tK(${i})" style="background:${k===i?ky.c:ky.c+'30'};color:${k===i?'white':ky.c};border:1.5px solid ${ky.c};border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600">${ky.l}</button>`).join('')}</div>
  ${k!==null?`<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid ${SE3_KEYS[k].c}"><p style="font-weight:500;color:${SE3_KEYS[k].c};margin-bottom:6px">${SE3_KEYS[k].l}</p><p class="muted" style="line-height:1.65">${SE3_KEYS[k].d}</p></div>`:`<p class="muted" style="text-align:center;padding:8px">👆 Tocá cualquier tecla</p>`}`;
 }
 if(slide.type==='cards')return hdr+slide.items.map(it=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:8px"><span style="font-size:22px">${it.ic}</span><div><p style="font-weight:500;margin-bottom:4px;font-size:14px">${it.t}</p><p class="muted" style="line-height:1.6">${it.d}</p></div></div>`).join('');
 if(slide.type==='steps')return hdr+slide.items.map((it,i)=>`<div class="srow"><div class="sn" style="background:${col}">${i+1}</div><div><p class="st">${it.t}</p>${it.d?`<p class="sd">${it.d}</p>`:''}</div></div>`).join('')+(slide.tip?`<div class="tip ${slide.tip.tp}">${slide.tip.tx}</div>`:'');
 if(slide.type==='notice'){
  return hdr+`<div style="background:var(--ok-bg);border:1.5px solid var(--ok-bd);border-radius:12px;padding:14px;margin-bottom:14px">
  <p style="font-weight:600;color:var(--ok);font-size:15px;margin-bottom:6px">✅ Información importante</p>
  <p style="font-size:13px;color:var(--ok);line-height:1.6">${slide.msg}</p></div>
  ${slide.params?`<p class="muted" style="font-weight:500;font-size:12px;margin-bottom:8px;text-transform:uppercase">Datos clave</p>${slide.params.map(p=>`<div class="prow"><span class="muted">${p.l}</span><span style="font-weight:500;font-size:14px">${p.v}</span></div>`).join('')}`:''}
  <div class="tip tw" style="margin-top:14px">⚠️ ${slide.warn}</div>`;
 }
 if(slide.type==='checklist'){
  const key=`${mi}_${si}`;const done=S.chk[key]||new Set();
  return hdr+slide.items.map((it,i)=>`<div class="chk ${done.has(i)?'done':''}" onclick="tC('${key}',${i})"><span style="font-size:18px;margin-top:1px">${done.has(i)?'✅':'⬜'}</span><span style="font-size:14px;line-height:1.5;color:${done.has(i)?'var(--ok)':'var(--tx)'}">${it}</span></div>`).join('')+(done.size===slide.items.length?`<div class="tip ts">✓ Lista completa</div>`:'');
 }
 if(slide.type==='leads_limb'){
  const a=S.al;const ld=a?LIMB.find(l=>l.id===a):null;
  return hdr+limbSVG()+`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${LIMB.map(l=>`<button onclick="tL('${l.id}')" style="background:${a===l.id?l.col:'transparent'};color:${a===l.id?'white':l.col};border:1.5px solid ${l.col};border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700">${l.id}</button>`).join('')}</div>
  ${ld?`<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid ${ld.col}"><p style="font-weight:600;font-size:15px;margin-bottom:4px">${ld.id} — Europeo: ${ld.eu}</p><p class="muted" style="margin-bottom:4px;font-size:12px">Americano: ${ld.us}</p><p style="font-size:14px">📍 ${ld.where}</p></div>`:`<p class="muted" style="text-align:center;padding:6px">👆 Tocá un electrodo</p>`}`;
 }
 if(slide.type==='leads_chest'){
  const a=S.al;const ld=a?CHEST.find(l=>l.id===a):null;
  return hdr+chestSVG()+`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">${CHEST.map(l=>`<button onclick="tL('${l.id}')" style="background:${a===l.id?l.col:'transparent'};color:${a===l.id?'white':l.col};border:1.5px solid ${l.col};border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700">${l.id}</button>`).join('')}</div>
  ${ld?`<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid ${ld.col}"><p style="font-weight:600;font-size:15px;margin-bottom:6px">${ld.id}</p><p style="font-size:14px">📍 ${ld.where}</p></div>`:`<p class="muted" style="text-align:center;padding:6px">👆 Tocá un electrodo</p>`}`;
 }
 return hdr;
}

</div></div>`;}

function rAdmPw(){return`<div class="w" style="padding-top:32px">
<button class="back" onclick="go('home')">← Volver</button>
<div class="card" style="text-align:center">
 <div style="font-size:32px;margin-bottom:12px">🔐</div>
 <p style="font-weight:500;font-size:16px;margin-bottom:4px">Panel administrador</p>
 <p class="muted" style="margin-bottom:16px">${BACKEND_URL?'Conectado a Google Sheets ✓':'Sin backend configurado'}</p>
 <input id="apw" type="password" placeholder="Contraseña" style="text-align:center;margin-bottom:8px">
 ${S.aerr?`<p style="color:var(--err);font-size:13px;margin-bottom:8px">${S.aerr}</p>`:''}
 <button class="btn btn-p" onclick="doAdm()">Ingresar</button>
</div>
${!BACKEND_URL?`<div class="card" style="margin-top:4px">
 <p class="muted" style="font-size:12px;line-height:1.7">⚙️ Para ver todos los usuarios desde cualquier dispositivo, configurar Google Apps Script y pegar la URL en el archivo HTML (ver <strong style="color:var(--tx)">backend_apps_script.gs</strong>). Mientras tanto, se muestran los registros de este dispositivo.</p>
</div>`:''}
</div>`;}

function rAdmin(){
 const us=S.aus;
 const loading=S.ausLoading;
 if(loading)return`<div class="w" style="text-align:center;padding-top:60px"><div style="font-size:32px" class="spin">⟳</div><p class="muted" style="margin-top:12px">Cargando datos${BACKEND_URL?' desde Google Sheets':''}...</p></div>`;

 // Build stats across all available equipment
 const avEqs=[];
 SVCS.forEach(svc=>svc.eq.filter(e=>e.ok).forEach(eq=>avEqs.push({svc,eq})));

 // Per-equipment rows
 const eqSections=avEqs.map(({svc,eq})=>{
  const con=eqContent(svc.id,eq.id);
  const qLen=con?.quiz.length||10;
  const mLen=con?.mods.length||5;
  // Aggregate per user for this equipment
  const rows=us.map(u=>{
   const p=prog(svc.id,eq.id,u);
   return{u,p};
  }).filter(({p})=>p.mods.length>0||p.done);
  const all=us.length;
  const studied=rows.length;
  const evaluated=rows.filter(({p})=>p.done).length;
  const approved=rows.filter(({p})=>p.done&&p.score>=PASS).length;
  const notApproved=evaluated-approved;
  const notStarted=all-studied;
  return`<div class="card" style="margin-bottom:12px">
  <p style="font-weight:600;font-size:14px;margin-bottom:2px">${eq.icon} ${eq.name}</p>
  <p class="muted" style="font-size:12px;margin-bottom:12px">${svc.name} · ${eq.type}</p>
  <div class="g4" style="margin-bottom:12px">
   <div class="sc"><p style="font-size:20px;font-weight:600;color:var(--ok)">${approved}</p><p class="muted" style="font-size:10px">Aprobados</p></div>
   <div class="sc"><p style="font-size:20px;font-weight:600;color:var(--err)">${notApproved}</p><p class="muted" style="font-size:10px">Refuerzo</p></div>
   <div class="sc"><p style="font-size:20px;font-weight:600;color:var(--warn)">${notStarted}</p><p class="muted" style="font-size:10px">Sin empezar</p></div>
   <div class="sc"><p style="font-size:20px;font-weight:600;color:var(--acc)">${all}</p><p class="muted" style="font-size:10px">Total</p></div>
  </div>
  ${us.map(u=>{
   const p=prog(svc.id,eq.id,u);
   const modsOk=p.mods.length>=mLen;
   const evOk=p.done;
   const aprOk=p.done&&p.score>=PASS;
   return`<div class="user-row" style="border-color:${!p.mods.length?'var(--bd)':aprOk?'var(--ok-bd)':evOk?'var(--err-bd)':'#1e3a8a'}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
     <div>
      <p style="font-weight:500;font-size:14px">${u.name}</p>
      <p class="muted" style="font-size:11px">${u.role} · ${u.dept}</p>
     </div>
     ${p.done?`<div style="text-align:right">
      <p style="font-size:18px;font-weight:600;color:${aprOk?'var(--ok)':'var(--err)'}">${p.score}/${qLen}</p>
      <p style="font-size:10px;font-weight:600;color:${aprOk?'var(--ok)':'var(--err)'}">${aprOk?'✓ APROBADO':'✗ REFUERZO'}</p>
     </div>`:`<p class="muted" style="font-size:11px">Sin rendir</p>`}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
     <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${p.mods.length?'var(--ok-bg)':'var(--card2)'};color:${p.mods.length?'var(--ok)':'var(--mu)'}">
      ${p.mods.length?'📚':'⬜'} Módulos: ${p.mods.length}/${mLen}
     </span>
     <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${p.done?'var(--ok-bg)':'var(--card2)'};color:${p.done?'var(--ok)':'var(--mu)'}">
      ${p.done?'📝':'⬜'} Evaluación: ${p.done?'✓':'pendiente'}
     </span>
     ${p.date?`<span style="font-size:11px;color:var(--mu)">📅 ${p.date}</span>`:''}
    </div>
   </div>`;
  }).join('')}
  ${!us.length?`<p class="muted" style="text-align:center;padding:12px">Sin registros aún</p>`:''}
 </div>`;
 }).join('');

 return`<div class="w">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
 <div>
  <h2 style="font-size:18px;font-weight:500">Panel de resultados</h2>
  <p class="muted" style="font-size:12px">${us.length} usuario${us.length!==1?'s':''} · ${BACKEND_URL?'Google Sheets':'este dispositivo'}</p>
 </div>
 <button class="back" style="margin:0" onclick="go('home')">Salir</button>
</div>
${eqSections}
${avEqs.length===0?`<div class="card" style="text-align:center;color:var(--mu)">No hay equipos activos aún</div>`:''}
</div>`;}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render(){
 const app=document.getElementById('app');
 const sc={login:rLogin,home:rHome,module:rModule,quiz:rQuiz,result:rResult,admin_pw:rAdmPw,admin:rAdmin};
 app.innerHTML=(sc[S.screen]||rLogin)();
 const b=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el[ev]=fn;};
 b('fn','oninput',e=>S.form.name=e.target.value);
 b('fr','onchange',e=>S.form.role=e.target.value);
 b('fd','oninput',e=>S.form.dept=e.target.value);
 b('apw','oninput',e=>S.apw=e.target.value);
 const apw=document.getElementById('apw');if(apw)apw.onkeydown=e=>e.key==='Enter'&&doAdm();
}

// ══════════════════════════════════════════
// HANDLERS
// ══════════════════════════════════════════
function go(s){S.screen=s;S.zone=null;S.ak=null;S.al=null;render();}

function doLogin(){
 const n=S.form.name.trim(),r=S.form.role,d=S.form.dept.trim();
 if(!n||!d)return;
 const uid='u:'+(n+'__'+d).toLowerCase().replace(/\W+/g,'_').slice(0,50);
 let u=db.get(uid)||{name:n,role:r,dept:d,progress:{}};
 u.name=n;u.role=r;u.dept=d;if(!u.progress)u.progress={};
 db.set(uid,u);S.user={...u,uid};S.screen='home';render();
}
function logout(){S.user=null;S.screen='login';render();}

function openEq(sId,eId){
 S.svcId=sId;S.eqId=eId;
 const p=prog(sId,eId);
 if(p.done){S.screen='result';render();return;}
 S.modIdx=0;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.screen='module';render();
}

function pS(){S.slideIdx--;S.zone=null;S.ak=null;S.al=null;render();}
function nS(){S.slideIdx++;S.zone=null;S.ak=null;S.al=null;render();}

async function cM(){
 const p=prog();const con=getCon();if(!con)return;
 const mods=[...new Set([...(p.mods||[]),S.modIdx])];
 const allDone=mods.length>=con.mods.length;
 setProg({mods});db.set(S.user.uid,S.user);
 // Sync to backend on module completion
 await syncBackend(S.svcId,S.eqId,prog());
 if(allDone&&!p.done){S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';}
 else if(allDone){S.screen='result';}
 else{S.modIdx++;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;}
 render();
}

function answer(i){
 if(S.chosen!==null)return;S.chosen=i;render();
 setTimeout(async()=>{
  const con=getCon();if(!con)return;
  const a=[...S.ans,i];S.ans=a;S.chosen=null;
  if(a.length===con.quiz.length){
   const sc=a.reduce((x,v,idx)=>x+(v===con.quiz[idx].ans?1:0),0);
   setProg({done:true,score:sc,date:new Date().toLocaleDateString('es-AR')});
   db.set(S.user.uid,S.user);
   // Sync final result to backend
   await syncBackend(S.svcId,S.eqId,prog());
   S.screen='result';
  }else{S.qIdx++;}render();
 },850);
}

async function rQ(){
 setProg({done:false,score:null,date:null});db.set(S.user.uid,S.user);
 S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';render();
}

function tZ(id){S.zone=S.zone===id?null:id;render();}
function tK(i){S.ak=S.ak===i?null:i;render();}
function tL(id){S.al=S.al===id?null:id;render();}
function tC(key,i){const s=S.chk[key]||new Set();const ns=new Set(s);ns.has(i)?ns.delete(i):ns.add(i);S.chk[key]=ns;render();}

async function doAdm(){
 if(S.apw!==APWD){S.aerr='Contraseña incorrecta';render();return;}
 S.aerr='';S.ausLoading=true;S.screen='admin';render();
 if(BACKEND_URL){
  // Fetch from Google Sheets
  const backendUsers=await fetchBackend();
  if(backendUsers){
   // Convert Google Sheets data to our user format
   S.aus=backendUsers.map(row=>{
    const name=row['Nombre']||'';const role=row['Rol']||'';const dept=row['Área/Servicio']||'';
    const svcName=row['Servicio']||'';const eqName=row['Equipo']||'';
    const done=String(row['Estado']||'').includes('APROBADO')||String(row['Estado']||'').includes('REFUERZO');
    const passed=String(row['Estado']||'').includes('APROBADO');
    const score=parseInt(row['Puntaje'])||0;
    const date=row['Fecha evaluación']||'-';
    // Find svc/eq ids from names
    let svcId='',eqId='';
    SVCS.forEach(s=>s.eq.forEach(e=>{if(e.name===eqName){svcId=s.id;eqId=e.id;}}));
    const progress={};
    const modsStr=String(row['Módulos completados']||'0/0');
    const modsCount=parseInt(modsStr)||0;
    if(svcId&&eqId){
     progress[`${svcId}/${eqId}`]={mods:Array.from({length:modsCount},(_,i)=>i),done,score,passed,date};
    }
    return{name,role,dept,progress};
   });
  }else{
   // Fallback to local
   const keys=db.keys('u:');
   S.aus=[];keys.forEach(k=>{const u=db.get(k);if(u)S.aus.push(u);});
  }
 }else{
  // Local only
  const keys=db.keys('u:');
  S.aus=[];keys.forEach(k=>{const u=db.get(k);if(u)S.aus.push(u);});
 }
 S.ausLoading=false;S.apw='';render();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
render();
</script>
</body>
</html>
