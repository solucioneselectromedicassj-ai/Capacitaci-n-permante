<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CapBioMed">
<link id="pwa-manifest" rel="manifest">
<title>Capacitación Biomédica — SEM</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#263248;--bd:#334155;--bds:#475569;
--ok:#22c55e;--ok-bg:#052e16;--ok-bd:#166534;
--warn:#f59e0b;--warn-bg:#451a03;--warn-bd:#92400e;
--err:#ef4444;--err-bg:#450a0a;--err-bd:#991b1b;
--p:#3b82f6;--tx:#f1f5f9;--mu:#94a3b8;--acc:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh}
.w{max-width:500px;margin:0 auto;padding:16px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bds);
background:var(--card2);color:var(--tx);font-size:14px;margin-bottom:4px;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p)}
.btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;
font-weight:500;cursor:pointer;margin-bottom:8px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-g{background:transparent;border:.5px solid var(--bds);color:var(--mu);font-size:12px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;margin-bottom:12px;padding:0}
.prog{background:var(--bd);border-radius:3px;height:4px}
.pf{height:4px;border-radius:3px;transition:width .3s}
.srow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sn{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;margin-top:1px}
.st{font-size:14px;line-height:1.55}.sd{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.tip{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.tw{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.ts{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.td{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.chk{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;
margin-bottom:8px;cursor:pointer;border:.5px solid var(--bd);transition:all .15s}
.chk.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt{background:var(--card2);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;
margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;transition:all .2s}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.ol{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid currentColor;
display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.eqli{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;
margin-bottom:8px;background:var(--card);border:.5px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;margin-top:4px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
border-radius:8px;background:var(--card2);border:.5px solid var(--bd);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;
gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;
cursor:pointer;margin-top:4px;margin-bottom:8px}
.user-row{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:.5px solid var(--bd);background:var(--card2)}
.img-slot{position:relative;margin-bottom:10px;border-radius:8px;overflow:hidden}
.img-slot img{width:100%;border-radius:8px;display:block}
.img-placeholder{background:var(--card2);border:1.5px dashed var(--bds);border-radius:8px;
padding:20px;text-align:center;color:var(--mu);font-size:13px;margin-bottom:10px}
</style>
</head>

function imgSlot(key, alt, svgFn){
  const id = 'img_'+key+'_'+Math.random().toString(36).slice(2,6);
  const sid = 'svg_'+id;
  return `<div class="img-slot">
    <img src="${IMGS[key]}" alt="${alt}"
      onload="document.getElementById('${sid}').style.display='none'"
      onerror="this.style.display='none'">
    <div id="${sid}">${svgFn()}</div>
  </div>`;
}

async function syncBackend(svcId,eqId,p){
 if(!BACKEND_URL||!S.user)return;
 const con=eqContent(svcId,eqId);
 const eq=SVCS.find(s=>s.id===svcId)?.eq.find(e=>e.id===eqId);
 const svc=SVCS.find(s=>s.id===svcId);
 try{await fetch(BACKEND_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({name:S.user.name,role:S.user.role,dept:S.user.dept,
   service:svc?.name,equipment:eq?.name,mods:p.mods.length,totalMods:con?.mods.length||0,
   done:p.done||false,score:p.score||0,totalQuiz:con?.quiz.length||10,
   passed:p.done&&p.score>=PASS,date:p.date||'-'})});}catch(e){}
}
async function fetchBackend(){
 if(!BACKEND_URL)return null;
 try{const r=await fetch(BACKEND_URL+'?nocache='+Date.now());const d=await r.json();return d.users||[];}catch{return null;}
}

 keys:p=>{const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))r.push(k);}}catch{}return r;},

 if(slide.type==='steps')return hdr+slide.items.map((it,i)=>`<div class="srow"><div class="sn" style="background:${col}">${i+1}</div><div><p class="st">${it.t}</p>${it.d?`<p class="sd">${it.d}</p>`:''}</div></div>`).join('')+(slide.tip?`<div class="tip ${slide.tip.tp}">${slide.tip.tx}</div>`:'');

 if(slide.type==='checklist'){

function rHome(){
 const u=S.user;
 const totalOk=SVCS.reduce((n,s)=>n+s.eq.filter(e=>e.ok).length,0);
 const doneOk=SVCS.reduce((n,s)=>n+s.eq.filter(e=>{const p=prog(s.id,e.id,u);return e.ok&&p.done&&p.score>=PASS;}).length,0);
 return`<div class="w">
<div class="card" style="display:flex;justify-content:space-between;align-items:flex-start">
 <div>
  <p style="font-weight:500;font-size:15px">${u.name}</p>
  <p class="muted">${u.role} · ${u.dept}</p>
  <p class="muted" style="margin-top:6px;font-size:12px">Equipos aprobados: ${doneOk}/${totalOk}</p>
 </div>
 <button onclick="logout()" style="background:none;border:none;color:var(--mu);cursor:pointer;font-size:12px">Salir</button>
</div>
${SVCS.map(svc=>`
<div class="sec-hdr"><span style="font-size:22px">${svc.icon}</span><p style="font-weight:600;font-size:15px">${svc.name}</p></div>
${svc.eq.map(eq=>{
 const p=prog(svc.id,eq.id,u);
 const passed=p.done&&p.score>=PASS,failed=p.done&&!passed,started=!p.done&&p.mods.length>0;
 const bc=!eq.ok?'var(--bd)':passed?'var(--ok-bd)':failed?'var(--err-bd)':started?'#1e40af':'var(--bd)';
 const badge=!eq.ok?`<span style="font-size:11px;color:var(--mu);background:var(--card2);border:.5px solid var(--bd);padding:2px 8px;border-radius:10px">Próximamente</span>`:
  passed?`<span style="font-size:11px;color:var(--ok);font-weight:600">✓ Aprobado</span>`:
  failed?`<span style="font-size:11px;color:var(--err);font-weight:600">✗ Refuerzo</span>`:
  started?`<span style="font-size:11px;color:var(--acc)">${p.mods.length} mód.</span>`:'';
 return`<div class="eqli" style="border-color:${bc};cursor:${eq.ok?'pointer':'default'};opacity:${eq.ok?1:.55}" onclick="${eq.ok?`openEq('${svc.id}','${eq.id}')`:''}" >
  <span style="font-size:22px">${eq.icon}</span>
  <div style="flex:1"><p style="font-weight:500;font-size:14px;margin-bottom:2px">${eq.name}</p><p class="muted" style="font-size:12px">${eq.type}</p></div>
  <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
   ${badge}${eq.ok?`<span style="font-size:16px;color:${passed?'var(--ok)':failed?'var(--err)':'var(--mu)'}">›</span>`:'<span>🔒</span>'}
  </div>
 </div>`;
}).join('')}`).join('')}
<div style="margin-top:8px"><button class="btn btn-g" onclick="go('admin_pw')">🔐 Panel administrador</button></div>
</div>`;}

function rModule(){
 const con=getCon();if(!con)return'';
 const mod=con.mods[S.modIdx],slide=mod.slides[S.slideIdx],total=mod.slides.length,pct=((S.slideIdx+1)/total)*100;
 const eq=SVCS.find(s=>s.id===S.svcId)?.eq.find(e=>e.id===S.eqId);
 return`<div class="w">
<button class="back" onclick="go('home')">← ${eq?.name||'Volver'}</button>
<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
 <span style="font-size:24px">${mod.icon}</span>
 <div><p style="font-weight:500;font-size:15px;margin-bottom:1px">${mod.title}</p>
 <p class="muted" style="font-size:12px">Paso ${S.slideIdx+1} de ${total}</p></div>
</div>
<div class="prog" style="margin-bottom:14px"><div class="pf" style="width:${pct}%;background:${mod.color}"></div></div>
<div class="card">${rSlide(mod,slide,S.modIdx,S.slideIdx)}</div>
<div style="display:flex;gap:8px">
 ${S.slideIdx>0?`<button class="btn" style="background:var(--card);border:.5px solid var(--bd);color:var(--tx);flex:1" onclick="pS()">← Anterior</button>`:''}
 ${S.slideIdx<total-1?`<button class="btn btn-p" style="flex:2" onclick="nS()">Siguiente →</button>`:`<button class="btn" style="background:${mod.color};color:white;flex:2" onclick="cM()">✓ Completar módulo</button>`}
</div></div>`;}

function rQuiz(){
 const con=getCon();if(!con)return'';
 const q=con.quiz[S.qIdx],pct=S.qIdx/con.quiz.length*100;
 return`<div class="w">
<p class="muted" style="margin-bottom:6px">Pregunta ${S.qIdx+1} de ${con.quiz.length}</p>
<div class="prog" style="margin-bottom:14px"><div class="pf" style="width:${pct}%;background:var(--p)"></div></div>
<div class="card"><p style="font-size:16px;font-weight:500;line-height:1.55;margin-bottom:16px">${q.q}</p>
${q.ops.map((op,i)=>{let cls='opt',ltr=String.fromCharCode(65+i);
 if(S.chosen!==null){if(i===q.ans){cls+=' ok';ltr='✓';}else if(i===S.chosen){cls+=' no';ltr='✗';}}
 return`<div class="${cls}" onclick="answer(${i})"><span class="ol">${ltr}</span><span>${op}</span></div>`;}).join('')}
</div></div>`;}

function rResult(){
 const con=getCon();if(!con)return'';
 const p=prog();const pass=p.score>=PASS;const pct=Math.round(p.score/con.quiz.length*100);
 const eq=SVCS.find(s=>s.id===S.svcId)?.eq.find(e=>e.id===S.eqId);
 const svc=SVCS.find(s=>s.id===S.svcId);
 const status=pass?'✅ APROBADO':'❌ NO APROBADO — requiere refuerzo presencial';
 const waMsg=encodeURIComponent(`🏥 *Capacitación Biomédica — SEM*\n📋 *Equipo:* ${eq?.name}\n👤 *${S.user.name}*\n🏷️ ${S.user.role} — ${S.user.dept}\n📊 *Resultado:* ${p.score}/${con.quiz.length} (${pct}%)\n${status}\n📅 ${p.date}`);
 return`<div class="w" style="text-align:center;padding-top:20px">
<div style="font-size:52px;margin-bottom:12px">${pass?'🎉':'📚'}</div>
<div class="card">
 <p class="muted" style="margin-bottom:4px">${svc?.name} · ${eq?.name}</p>
 <p style="font-size:18px;font-weight:500;color:${pass?'var(--ok)':'var(--err)'};margin-bottom:8px">${pass?'¡Aprobado!':'No aprobado'}</p>
 <p style="font-size:40px;font-weight:500;color:${pass?'var(--ok)':'var(--err)'};margin-bottom:4px">${p.score}/${con.quiz.length}</p>
 <p class="muted" style="margin-bottom:16px">${pct}% — mínimo: 80%</p>
 <div style="background:var(--bd);border-radius:4px;height:8px;margin-bottom:20px">
  <div style="background:${pass?'var(--ok)':'var(--err)'};height:8px;border-radius:4px;width:${pct}%"></div>
 </div>
 <button class="wa" onclick="window.open('https://wa.me/?text=${waMsg}','_blank')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  Compartir resultado por WhatsApp
 </button>
 ${!pass?`<button class="btn" style="background:var(--warn);color:white" onclick="rQ()">🔄 Intentar nuevamente</button>`:''}
 <button class="btn btn-p" onclick="go('home')">← Volver al inicio</button>
</div></div>`;}

function rAdmPw(){return`<div class="w" style="padding-top:32px">
<button class="back" onclick="go('home')">← Volver</button>
<div class="card" style="text-align:center">
 <div style="font-size:32px;margin-bottom:12px">🔐</div>
 <p style="font-weight:500;font-size:16px;margin-bottom:4px">Panel administrador</p>
 <p class="muted" style="margin-bottom:16px">${BACKEND_URL?'Conectado a Google Sheets ✓':'Sin backend — datos de este dispositivo'}</p>
 <input id="apw" type="password" placeholder="Contraseña" style="text-align:center;margin-bottom:8px">
 ${S.aerr?`<p style="color:var(--err);font-size:13px;margin-bottom:8px">${S.aerr}</p>`:''}
 <button class="btn btn-p" onclick="doAdm()">Ingresar</button>
</div></div>`;}

function rAdmin(){
 const us=S.aus,loading=S.ausLoading;
 if(loading)return`<div class="w" style="text-align:center;padding-top:60px"><div style="font-size:32px;animation:spin 1s linear infinite;display:inline-block">⟳</div><p class="muted" style="margin-top:12px">Cargando datos...</p><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>`;
 const avEqs=[];SVCS.forEach(svc=>svc.eq.filter(e=>e.ok).forEach(eq=>avEqs.push({svc,eq})));
 return`<div class="w">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
 <div><h2 style="font-size:18px;font-weight:500">Resultados</h2>
 <p class="muted" style="font-size:12px">${us.length} usuario${us.length!==1?'s':''} · ${BACKEND_URL?'Google Sheets':'este dispositivo'}</p></div>
 <button class="back" style="margin:0" onclick="go('home')">Salir</button>
</div>
${avEqs.map(({svc,eq})=>{
 const con=eqContent(svc.id,eq.id);
 const qLen=con?.quiz.length||10,mLen=con?.mods.length||5;
 const approved=us.filter(u=>prog(svc.id,eq.id,u).done&&prog(svc.id,eq.id,u).score>=PASS).length;
 const evaluated=us.filter(u=>prog(svc.id,eq.id,u).done).length;
 const studying=us.filter(u=>!prog(svc.id,eq.id,u).done&&prog(svc.id,eq.id,u).mods.length>0).length;
 const notStarted=us.length-evaluated-studying;
 const needsRefresh=evaluated-approved;
 return`<div class="card" style="margin-bottom:12px">
 <p style="font-weight:600;font-size:14px;margin-bottom:2px">${eq.icon} ${eq.name}</p>
 <p class="muted" style="font-size:12px;margin-bottom:12px">${svc.name}</p>
 <div class="g4" style="margin-bottom:12px">
  <div class="sc"><p style="font-size:18px;font-weight:600;color:var(--ok)">${approved}</p><p class="muted" style="font-size:10px">Aprobaron</p></div>
  <div class="sc"><p style="font-size:18px;font-weight:600;color:var(--err)">${needsRefresh}</p><p class="muted" style="font-size:10px">Refuerzo</p></div>
  <div class="sc"><p style="font-size:18px;font-weight:600;color:var(--acc)">${studying}</p><p class="muted" style="font-size:10px">Estudiando</p></div>
  <div class="sc"><p style="font-size:18px;font-weight:600;color:var(--mu)">${notStarted}</p><p class="muted" style="font-size:10px">Sin empezar</p></div>
 </div>
 ${us.map(u=>{
  const p=prog(svc.id,eq.id,u);
  const modsN=p.mods.length,evOk=p.done,aprOk=p.done&&p.score>=PASS;
  const rowBorder=!modsN?'var(--bd)':aprOk?'var(--ok-bd)':evOk?'var(--err-bd)':'#1e40af';
  return`<div class="user-row" style="border-color:${rowBorder}">
   <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
    <div>
     <p style="font-weight:500;font-size:14px">${u.name}</p>
     <p class="muted" style="font-size:11px">${u.role} · ${u.dept}</p>
    </div>
    ${evOk?`<div style="text-align:right">
     <p style="font-size:18px;font-weight:600;color:${aprOk?'var(--ok)':'var(--err)'}">${p.score}/${qLen}</p>
     <p style="font-size:10px;font-weight:600;color:${aprOk?'var(--ok)':'var(--err)'}">${aprOk?'✓ APROBADO':'✗ REFUERZO'}</p>
    </div>`:`<p class="muted" style="font-size:11px">${modsN?'En curso':'Sin empezar'}</p>`}
   </div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${modsN?'var(--ok-bg)':'var(--card2)'};color:${modsN?'var(--ok)':'var(--mu)'}">
     ${modsN?'📚':'⬜'} Módulos: ${modsN}/${mLen}
    </span>
    <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${evOk?'var(--ok-bg)':'var(--card2)'};color:${evOk?'var(--ok)':'var(--mu)'}">
     ${evOk?'📝':'⬜'} Evaluación: ${evOk?'rendida':'pendiente'}
    </span>
    ${p.date?`<span style="font-size:11px;color:var(--mu)">📅 ${p.date}</span>`:''}
   </div>
  </div>`;
 }).join('')}
 ${!us.length?`<p class="muted" style="text-align:center;padding:12px">Sin registros aún</p>`:''}
</div>`;}).join('')}
${!avEqs.length?`<div class="card" style="text-align:center;color:var(--mu)">Sin equipos activos</div>`:''}
</div>`;}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function render(){
 const app=document.getElementById('app');
 const sc={login:rLogin,home:rHome,module:rModule,quiz:rQuiz,result:rResult,admin_pw:rAdmPw,admin:rAdmin};
 app.innerHTML=(sc[S.screen]||rLogin)();
 const b=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el[ev]=fn;};
 b('fn','oninput',e=>S.form.name=e.target.value);
 b('fr','onchange',e=>S.form.role=e.target.value);
 b('fd','oninput',e=>S.form.dept=e.target.value);
 b('apw','oninput',e=>S.apw=e.target.value);
 const apw=document.getElementById('apw');if(apw)apw.onkeydown=e=>e.key==='Enter'&&doAdm();
}

// ══════════════════════════════════════════
// HANDLERS
// ══════════════════════════════════════════
function go(s){S.screen=s;S.zone=null;S.ak=null;S.al=null;render();}
function doLogin(){
 const n=S.form.name.trim(),r=S.form.role,d=S.form.dept.trim();
 if(!n||!d)return;
 const uid='u:'+(n+'__'+d).toLowerCase().replace(/\W+/g,'_').slice(0,50);
 let u=db.get(uid)||{name:n,role:r,dept:d,progress:{}};
 u.name=n;u.role=r;u.dept=d;if(!u.progress)u.progress={};
 db.set(uid,u);S.user={...u,uid};S.screen='home';render();
}
function logout(){S.user=null;S.screen='login';render();}
function openEq(sId,eId){
 S.svcId=sId;S.eqId=eId;
 const p=prog(sId,eId);
 if(p.done){S.screen='result';render();return;}
 S.modIdx=0;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.screen='module';render();
}
function pS(){S.slideIdx--;S.zone=null;S.ak=null;S.al=null;render();}
function nS(){S.slideIdx++;S.zone=null;S.ak=null;S.al=null;render();}
async function cM(){
 const p=prog();const con=getCon();if(!con)return;
 const mods=[...new Set([...(p.mods||[]),S.modIdx])];
 const allDone=mods.length>=con.mods.length;
 setProg({mods});db.set(S.user.uid,S.user);
 await syncBackend(S.svcId,S.eqId,prog());
 if(allDone&&!p.done){S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';}
 else if(allDone){S.screen='result';}
 else{S.modIdx++;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;}
 render();
}
function answer(i){
 if(S.chosen!==null)return;S.chosen=i;render();
 setTimeout(async()=>{
  const con=getCon();if(!con)return;
  const a=[...S.ans,i];S.ans=a;S.chosen=null;
  if(a.length===con.quiz.length){
   const sc=a.reduce((x,v,idx)=>x+(v===con.quiz[idx].ans?1:0),0);
   setProg({done:true,score:sc,date:new Date().toLocaleDateString('es-AR')});
   db.set(S.user.uid,S.user);
   await syncBackend(S.svcId,S.eqId,prog());
   S.screen='result';
  }else{S.qIdx++;}render();
 },850);
}
async function rQ(){
 setProg({done:false,score:null,date:null});db.set(S.user.uid,S.user);
 S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';render();
}
function tZ(id){S.zone=S.zone===id?null:id;render();}
function tK(i){S.ak=S.ak===i?null:i;render();}
function tL(id){S.al=S.al===id?null:id;render();}
function tC(key,i){const s=S.chk[key]||new Set();const ns=new Set(s);ns.has(i)?ns.delete(i):ns.add(i);S.chk[key]=ns;render();}
async function doAdm(){
 if(S.apw!==APWD){S.aerr='Contraseña incorrecta';render();return;}
 S.aerr='';S.ausLoading=true;S.screen='admin';render();
 if(BACKEND_URL){
  const bu=await fetchBackend();
  if(bu){
   S.aus=bu.map(row=>{
    const name=row['Nombre']||'',role=row['Rol']||'',dept=row['Área/Servicio']||'';
    const done=String(row['Estado']||'').includes('APROBADO')||String(row['Estado']||'').includes('REFUERZO');
    const score=parseInt(row['Puntaje'])||0,date=row['Fecha evaluación']||'-';
    let svcId='',eqId='';
    SVCS.forEach(s=>s.eq.forEach(e=>{if(e.name===row['Equipo']){svcId=s.id;eqId=e.id;}}));
    const modsCount=parseInt(String(row['Módulos completados']||'0'))||0;
    const progress={};
    if(svcId&&eqId)progress[`${svcId}/${eqId}`]={mods:Array.from({length:modsCount},(_,i)=>i),done,score,date};
    return{name,role,dept,progress};
   });
  }else{const keys=db.keys('u:');S.aus=[];keys.forEach(k=>{const u=db.get(k);if(u)S.aus.push(u);});}
 }else{const keys=db.keys('u:');S.aus=[];keys.forEach(k=>{const u=db.get(k);if(u)S.aus.push(u);});}
 S.ausLoading=false;S.apw='';render();
}
render();
</script>
</body>
</html>
