:root{--bg:#0f172a;--card:#1e293b;--card2:#263248;--bd:#334155;--bds:#475569;--ok:#22c55e;--ok-bg:#052e16;--ok-bd:#166534;--warn:#f59e0b;--warn-bg:#451a03;--warn-bd:#92400e;--err:#ef4444;--err-bg:#450a0a;--err-bd:#991b1b;--p:#8b0000;--tx:#f1f5f9;--mu:#94a3b8;--acc:#fca5a5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh}
.w{max-width:500px;margin:0 auto;padding:16px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bds);background:var(--card2);color:var(--tx);font-size:14px;margin-bottom:4px;outline:none;-webkit-appearance:none}
.btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-g{background:transparent;border:.5px solid var(--bds);color:var(--mu);font-size:12px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;margin-bottom:12px;padding:0}
.prog{background:var(--bd);border-radius:3px;height:4px}
.pf{height:4px;border-radius:3px;transition:width .3s}
.srow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sn{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;margin-top:1px}
.st{font-size:14px;line-height:1.55}
.sd{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.tip{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.tw{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.ts{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.td{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.chk{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:.5px solid var(--bd);transition:all .15s}
.chk.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt{background:var(--card2);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;transition:all .2s}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.ol{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.eqli{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;margin-bottom:8px;background:var(--card);border:.5px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;margin-top:4px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;background:var(--card2);border:.5px solid var(--bd);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;margin-bottom:8px}
.urow{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:.5px solid var(--bd);background:var(--card2)}
.iimg{position:relative;user-select:none;-webkit-user-select:none}
.iimg img{width:100%;border-radius:8px;display:block}
.rh{background:linear-gradient(135deg,#8b0000,#6b0000);padding:12px 16px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:10px}

function render(){
 var app=document.getElementById('app');
 var sc={login:rLogin,home:rHome,module:rModule,miniquiz:rMiniQuiz,mq_result:rMQResult,quiz:rQuiz,result:rResult,expired:rExpired,admin_pw:rAdmPw,admin:rAdmin};

function openEq(sId,eId){S.svcId=sId;S.eqId=eId;var pp=prog(sId,eId);if(pp.certified&&isExpired(pp.certExpiry)){S.screen='expired';render();return;}if(pp.certified&&!isExpired(pp.certExpiry)){logAcc('review');S.modIdx=0;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.reviewMode=true;S.screen='module';render();return;}logAcc('training');S.reviewMode=false;var con=eqC(sId,eId);S.modIdx=0;if(con&&pp.mods.length>0&&pp.mods.length<con.mods.length){for(var i=0;i<con.mods.length;i++){var found=false;for(var j=0;j<pp.mods.length;j++){if(pp.mods[j]===i){found=true;break;}}if(!found){S.modIdx=i;break;}}}S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.screen='module';render();}

  var mods=pp.mods.slice();if(mods.indexOf(S.modIdx)<0)mods.push(S.modIdx);

  if(mods.length>=con.mods.length){S.screen='home';}else{S.modIdx++;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.screen='module';}

 }
 S.mq={moduleId:S.modIdx,questions:qs,qIdx:0,answers:[],chosen:null};

function mqAns(i){var mq=S.mq;if(!mq||mq.chosen!==null)return;mq.chosen=i;render();setTimeout(function(){var q=mq.questions[mq.qIdx];mq.answers.push(i);mq.chosen=null;if(mq.qIdx<mq.questions.length-1){mq.qIdx++;render();}else{var score=0;for(var j=0;j<mq.answers.length;j++){if(mq.answers[j]===mq.questions[j].ans)score++;}mq.score=score;mq.passed=(score>=Math.ceil(mq.questions.length*0.75));if(mq.passed){var pp=prog();var mods=pp.mods.slice();if(mods.indexOf(mq.moduleId)<0)mods.push(mq.moduleId);sP({mods:mods});db.set(S.user.uid,S.user);syncB(S.svcId,S.eqId,prog());}S.screen='mq_result';render();}},850);}
