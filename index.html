<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CapBioMed">
<link id="pwa-manifest" rel="manifest">
<title>Capacitacion Biomedica - SEM</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#263248;--bd:#334155;--bds:#475569;
--ok:#22c55e;--ok-bg:#052e16;--ok-bd:#166534;
--warn:#f59e0b;--warn-bg:#451a03;--warn-bd:#92400e;
--err:#ef4444;--err-bg:#450a0a;--err-bd:#991b1b;
--p:#3b82f6;--tx:#f1f5f9;--mu:#94a3b8;--acc:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh}
.w{max-width:500px;margin:0 auto;padding:16px}
.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.muted{color:var(--mu);font-size:13px;line-height:1.5}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px;margin-top:8px}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--bds);
background:var(--card2);color:var(--tx);font-size:14px;margin-bottom:4px;outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--p)}
.btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;
font-weight:500;cursor:pointer;margin-bottom:8px;text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-p{background:var(--p);color:#fff}
.btn-g{background:transparent;border:.5px solid var(--bds);color:var(--mu);font-size:12px}
.back{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;margin-bottom:12px;padding:0}
.prog{background:var(--bd);border-radius:3px;height:4px}
.pf{height:4px;border-radius:3px;transition:width .3s}
.srow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.sn{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0;margin-top:1px}
.st{font-size:14px;line-height:1.55}
.sd{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.45}
.tip{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55;border-width:1px;border-style:solid}
.tw{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.ts{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.td{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.chk{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;
margin-bottom:8px;cursor:pointer;border:.5px solid var(--bd);transition:all .15s}
.chk.done{background:var(--ok-bg);border-color:var(--ok-bd)}
.opt{background:var(--card2);border:1.5px solid var(--bd);border-radius:10px;padding:11px 14px;
margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;transition:all .2s}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--err-bd);color:var(--err)}
.ol{width:24px;height:24px;min-width:24px;border-radius:50%;border:1.5px solid currentColor;
display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.eqli{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;
margin-bottom:8px;background:var(--card);border:.5px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:8px 0;margin-top:4px;margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
border-radius:8px;background:var(--card2);border:.5px solid var(--bd);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.sc{background:var(--card);border:.5px solid var(--bd);border-radius:10px;padding:10px 6px;text-align:center}
.wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;
gap:8px;width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;margin-bottom:8px}
.urow{padding:10px 12px;border-radius:8px;margin-bottom:6px;border:.5px solid var(--bd);background:var(--card2)}
.iimg{position:relative;margin-bottom:14px;user-select:none;-webkit-user-select:none}
.iimg img{width:100%;border-radius:8px;display:block}
</style>
</head>

// ═══ HELPER: INTERACTIVE IMAGE ═══
function renderHotImg(imgKey,hotspots,title,sub){
 var a=S.al,ah=null;
 for(var i=0;i<hotspots.length;i++){if(hotspots[i].id===a){ah=hotspots[i];break;}}
 var hh='';
 for(var i=0;i<hotspots.length;i++){
  var h=hotspots[i],act=(a===h.id);
  var bc=act?('2.5px solid '+h.col):('1.5px solid '+h.col+'88');
  var bg=act?(h.col+'30'):'transparent';
  hh+='<div onclick="tL(\''+h.id+'\')" style="position:absolute;left:'+h.x+'%;top:'+h.y+'%;width:'+h.w+'%;height:'+h.h+'%;cursor:pointer;border-radius:6px;border:'+bc+';background:'+bg+';transition:all .2s">';
  hh+='<span style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:'+h.col+';color:white;font-size:9px;padding:2px 6px;border-radius:8px;white-space:nowrap;font-weight:700;pointer-events:none">'+h.label+'</span></div>';
 }
 var mb=ah?'28px':'14px';
 var out='';
 if(title)out+='<h3 style="font-size:17px;font-weight:500;margin-bottom:'+(sub?'3px':'10px')+'">'+title+'</h3>';
 if(sub)out+='<p class="muted" style="margin-bottom:10px">'+sub+'</p>';
 out+='<div class="iimg" style="margin-bottom:'+mb+'">';
 out+='<img src="'+IMG[imgKey]+'" style="width:100%;border-radius:8px;display:block">';
 out+=hh+'</div>';
 if(ah){
  out+='<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid '+ah.col+';margin-top:8px">';
  out+='<p style="font-weight:600;color:'+ah.col+';margin-bottom:6px">'+ah.label+'</p>';
  out+='<p class="muted" style="line-height:1.65;white-space:pre-line">'+ah.info+'</p></div>';
 }else{
  out+='<p class="muted" style="text-align:center;padding:8px;font-size:13px">Toca las zonas marcadas</p>';
 }
 return out;
}

// ═══ CONTENT HELPER ═══
function hdr(title,sub){
 return '<h3 style="font-size:17px;font-weight:500;margin-bottom:'+(sub?'3px':'10px')+'">'+title+'</h3>'+(sub?'<p class="muted" style="margin-bottom:10px">'+sub+'</p>':'');
}
function cardRow(ic,t,d){return '<div style="display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card2);border-radius:10px;margin-bottom:8px"><span style="font-size:22px">'+ic+'</span><div><p style="font-weight:500;margin-bottom:4px;font-size:14px">'+t+'</p><p class="muted" style="line-height:1.6;white-space:pre-line">'+d+'</p></div></div>';}
function stepRow(n,t,d,col){return '<div class="srow"><div class="sn" style="background:'+col+'">'+n+'</div><div><p class="st">'+t+'</p>'+(d?'<p class="sd">'+d+'</p>':'')+'</div></div>';}
function tipBox(cls,txt){return '<div class="tip '+cls+'">'+txt+'</div>';}
function noticeBox(msg,params,warn){
 var h='<div style="background:var(--ok-bg);border:1.5px solid var(--ok-bd);border-radius:12px;padding:14px;margin-bottom:14px"><p style="font-weight:600;color:var(--ok);font-size:15px;margin-bottom:6px">Informacion importante</p><p style="font-size:13px;color:var(--ok);line-height:1.6">'+msg+'</p></div>';
 if(params){h+='<p class="muted" style="font-weight:500;font-size:12px;margin-bottom:8px;text-transform:uppercase">Datos clave</p>';for(var i=0;i<params.length;i++){h+='<div class="prow"><span class="muted">'+params[i][0]+'</span><span style="font-weight:500;font-size:14px">'+params[i][1]+'</span></div>';}}
 if(warn)h+=tipBox('tw',warn);
 return h;
}

  var zo=null;

 }
 if(slide.type==='device_dfm'){
  var zo=null;
  if(S.zone){for(var i=0;i<DFM100_ZONES.length;i++){if(DFM100_ZONES[i].id===S.zone){zo=DFM100_ZONES[i];break;}}}
  var imgHtml='<div style="margin-bottom:10px;position:relative"><img src="'+IMG.dfm100_front+'" style="width:100%;border-radius:8px;display:block" onerror="this.style.display=\'none\'"><div style="padding:8px;background:var(--card2);border-radius:8px">'+dfm100SVG()+'</div></div>';
  var info=zo?('<div style="border-radius:10px;padding:12px;background:var(--card2);border:1.5px solid '+zo.col+';white-space:pre-line"><p style="font-weight:500;color:'+zo.col+';margin-bottom:6px">'+zo.label+'</p><p class="muted" style="line-height:1.65">'+zo.desc+'</p></div>'):'<p class="muted" style="text-align:center;padding:8px">Toca cada zona del equipo</p>';
  return h+imgHtml+info;
 }
 if(slide.type==='keys'){
  var k=S.ak;
  var btns='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  for(var i=0;i<SE3_KEYS.length;i++){
   var ky=SE3_KEYS[i];
   btns+='<button onclick="tK('+i+')" style="background:'+(k===i?ky.c:ky.c+'30')+';color:'+(k===i?'white':ky.c)+';border:1.5px solid '+ky.c+';border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600">'+ky.l+'</button>';

  var out=h;
  for(var i=0;i<slide.items.length;i++){var it=slide.items[i];out+=cardRow(it.ic,it.t,it.d);}

 }
 if(slide.type==='steps'){

function eqContent(s,e){
 if(s==='cm'&&e==='se3')return{mods:MODS_SE3,quiz:QUIZ_SE3};
 if(s==='cm'&&e==='dfm100')return{mods:MODS_DFM100,quiz:QUIZ_DFM100};
 return null;
}
function getCon(){return eqContent(S.svcId,S.eqId);}
function pk(s,e){return (s||S.svcId)+'/'+(e||S.eqId);}
function prog(s,e,u){var r=(u||S.user);return (r&&r.progress&&r.progress[pk(s,e)])||{mods:[],done:false,score:null,date:null};}
function setProg(up){var k=pk();var p=Object.assign({},prog(),up);if(!S.user.progress)S.user.progress={};S.user.progress[k]=p;}

function syncBackend(sId,eId,p){
 if(!BACKEND_URL||!S.user)return;
 var con=eqContent(sId,eId);
 var eq=null,svc=null;
 for(var i=0;i<SVCS.length;i++){for(var j=0;j<SVCS[i].eq.length;j++){if(SVCS[i].eq[j].id===eId){eq=SVCS[i].eq[j];svc=SVCS[i];}}}
 try{fetch(BACKEND_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:S.user.name,role:S.user.role,dept:S.user.dept,service:svc?svc.name:'',equipment:eq?eq.name:'',mods:p.mods.length,totalMods:con?con.mods.length:0,done:p.done||false,score:p.score||0,totalQuiz:con?con.quiz.length:10,passed:p.done&&p.score>=PASS,date:p.date||'-'})});}catch(e){}
}
function fetchBackend(cb){
 if(!BACKEND_URL)return cb(null);
 fetch(BACKEND_URL+'?nocache='+Date.now()).then(function(r){return r.json();}).then(function(d){cb(d.users||[]);}).catch(function(){cb(null);});
}

}

// ═══ RENDER ═══
function render(){
 var app=document.getElementById('app');
 var screens={login:rLogin,home:rHome,module:rModule,quiz:rQuiz,result:rResult,admin_pw:rAdmPw,admin:rAdmin};
 app.innerHTML=(screens[S.screen]||rLogin)();
 var fn=document.getElementById('fn');if(fn)fn.oninput=function(e){S.form.name=e.target.value;};
 var fr=document.getElementById('fr');if(fr)fr.onchange=function(e){S.form.role=e.target.value;};
 var fd=document.getElementById('fd');if(fd)fd.oninput=function(e){S.form.dept=e.target.value;};
 var apw=document.getElementById('apw');
 if(apw){apw.oninput=function(e){S.apw=e.target.value;};apw.onkeydown=function(e){if(e.key==='Enter')doAdm();};}
}

// ═══ HANDLERS ═══
function go(s){S.screen=s;S.zone=null;S.ak=null;S.al=null;render();}
function doLogin(){
 var n=S.form.name.trim(),r=S.form.role,d=S.form.dept.trim();
 if(!n||!d)return;
 var uid='u:'+(n+'__'+d).toLowerCase().replace(/\W+/g,'_').slice(0,50);
 var u=db.get(uid)||{name:n,role:r,dept:d,progress:{}};
 u.name=n;u.role=r;u.dept=d;if(!u.progress)u.progress={};
 db.set(uid,u);S.user=u;S.user.uid=uid;S.screen='home';render();
}
function logout(){S.user=null;S.screen='login';render();}
function openEq(sId,eId){
 S.svcId=sId;S.eqId=eId;var p=prog(sId,eId);
 if(p.done){S.screen='result';render();return;}
 S.modIdx=0;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;S.screen='module';render();
}
function pS(){S.slideIdx--;S.zone=null;S.ak=null;S.al=null;render();}
function nS(){S.slideIdx++;S.zone=null;S.ak=null;S.al=null;render();}
function cM(){
 var p=prog();var con=getCon();if(!con)return;
 var mods=p.mods.slice();if(mods.indexOf(S.modIdx)<0)mods.push(S.modIdx);
 var allDone=mods.length>=con.mods.length;
 setProg({mods:mods});db.set(S.user.uid,S.user);
 syncBackend(S.svcId,S.eqId,prog());
 if(allDone&&!p.done){S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';}
 else if(allDone){S.screen='result';}
 else{S.modIdx++;S.slideIdx=0;S.zone=null;S.ak=null;S.al=null;}
 render();
}
function answer(i){
 if(S.chosen!==null)return;S.chosen=i;render();
 setTimeout(function(){
  var con=getCon();if(!con)return;
  var a=S.ans.slice();a.push(i);S.ans=a;S.chosen=null;
  if(a.length===con.quiz.length){
   var sc=0;for(var j=0;j<a.length;j++){if(a[j]===con.quiz[j].ans)sc++;}
   setProg({done:true,score:sc,date:new Date().toLocaleDateString('es-AR')});
   db.set(S.user.uid,S.user);
   syncBackend(S.svcId,S.eqId,prog());
   S.screen='result';
  }else{S.qIdx++;}render();
 },850);
}
function rQ(){
 setProg({done:false,score:null,date:null});db.set(S.user.uid,S.user);
 S.ans=[];S.qIdx=0;S.chosen=null;S.screen='quiz';render();
}
function tZ(id){S.zone=S.zone===id?null:id;render();}
function tK(i){S.ak=S.ak===i?null:i;render();}
function tL(id){S.al=S.al===id?null:id;render();}
function tC(key,i){
 if(!S.chk[key])S.chk[key]={};
 if(S.chk[key][i])delete S.chk[key][i];
 else S.chk[key][i]=true;
 render();
}
function doAdm(){
 if(S.apw!==APWD){S.aerr='Contrasena incorrecta';render();return;}
 S.aerr='';S.ausLoad=true;S.screen='admin';render();
 if(BACKEND_URL){
  fetchBackend(function(bu){
   if(bu){
    S.aus=bu.map(function(row){
     var name=row['Nombre']||'',role=row['Rol']||'',dept=row['Area/Servicio']||'';
     var done=String(row['Estado']||'').indexOf('APROBADO')>=0||String(row['Estado']||'').indexOf('REFUERZO')>=0;
     var score=parseInt(row['Puntaje'])||0,date=row['Fecha evaluacion']||'-';
     var svcId='',eqId='';
     for(var i=0;i<SVCS.length;i++){for(var j=0;j<SVCS[i].eq.length;j++){if(SVCS[i].eq[j].name===row['Equipo']){svcId=SVCS[i].id;eqId=SVCS[i].eq[j].id;}}}
     var modsCount=parseInt(String(row['Modulos completados']||'0'))||0;
     var progress={};
     if(svcId&&eqId)progress[svcId+'/'+eqId]={mods:[],done:done,score:score,date:date};
     return{name:name,role:role,dept:dept,progress:progress};
    });
   }else{
    var keys=db.keys('u:');S.aus=[];
    for(var i=0;i<keys.length;i++){var u=db.get(keys[i]);if(u)S.aus.push(u);}
   }
   S.ausLoad=false;S.apw='';render();
  });
 }else{
  var keys=db.keys('u:');S.aus=[];
  for(var i=0;i<keys.length;i++){var u=db.get(keys[i]);if(u)S.aus.push(u);}
  S.ausLoad=false;S.apw='';render();
 }
}
render();

</script>
